# =============================================================================
# STEP 1: Save CLIP Teacher Logits on ImageNet-1K (Top-50)
# =============================================================================
# Generate soft labels from finetuned CLIP for knowledge distillation.
# Saves top-50 logits per image across 10 epochs with augmentation.
# These are cycled during student training (epoch % 10).
#
# PREREQUISITE: Run step0_clip_finetune.yaml first!
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 save_logits.py \
#     --cfg configs/experiments/step1_clip_save_logits.yaml \
#     --data-path ./data/ImageNet \
#     --output ./output/exp_clip_logits \
#     --resume ./output/exp_clip_finetune/CLIP-ViT-L-Finetune/default/ckpt_epoch_19.pth
#
# Output: ./output/exp_clip_logits/ with epoch_0/ to epoch_9/
# Storage: ~50GB for 10 epochs
# Time: ~3-4 hours on 1 GPU

MODEL:
  NAME: CLIP-ViT-L-SaveLogits
  TYPE: clip_vit_large_patch14
  NUM_CLASSES: 1000
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  PRETRAINED_TIMM: True

DATA:
  DATASET: imagenet
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128
  NUM_WORKERS: 8
  PIN_MEMORY: True
  MEAN_AND_STD_TYPE: clip

TRAIN:
  EPOCHS: 10
  WARMUP_EPOCHS: 0
  BASE_LR: 0.0  # No training
  WEIGHT_DECAY: 0.0

DISTILL:
  ENABLED: False
  SAVE_TEACHER_LOGITS: True
  LOGITS_TOPK: 50

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 500
SAVE_FREQ: 1
