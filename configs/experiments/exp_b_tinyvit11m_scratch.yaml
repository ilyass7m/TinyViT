# =============================================================================
# EXPERIMENT B: TinyViT-11M Trained from Scratch on ImageNet-1K (Baseline)
# =============================================================================
# Baseline comparison - train TinyViT-11M without knowledge distillation.
# Same architecture and schedule as Experiment A for fair comparison.
#
# After pretraining, finetune on CIFAR-100 for evaluation.
#
# Usage:
#   torchrun --nproc_per_node=4 --master_port=29500 main.py \
#     --cfg configs/experiments/exp_b_tinyvit11m_scratch.yaml \
#     --data-path ./data/ImageNet \
#     --output ./output/exp_b_scratch
#
# Expected: ~80-81% top-1 on ImageNet-1K
# Time: ~24-48 hours on 4 GPUs (300 epochs)

MODEL:
  NAME: TinyViT-11M-Scratch
  TYPE: tiny_vit
  NUM_CLASSES: 1000
  DROP_PATH_RATE: 0.1
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.1

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 8, 14 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 256, 448 ]

DATA:
  DATASET: imagenet
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 300
  WARMUP_EPOCHS: 20
  BASE_LR: 2e-3
  WARMUP_LR: 2e-6
  MIN_LR: 2e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.9
  AUTO_RESUME: True

DISTILL:
  ENABLED: False

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.8
  CUTMIX: 1.0
  MIXUP_PROB: 1.0
  MIXUP_SWITCH_PROB: 0.5
  MIXUP_MODE: batch

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 100
SAVE_FREQ: 10
