# =============================================================================
# CIFAR-100 Evaluation: TinyViT-11M from Distillation Pretraining
# =============================================================================
# Finetune the distillation-pretrained model on CIFAR-100 for evaluation.
# Compare final accuracy with scratch baseline.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/experiments/eval_cifar100_from_distill.yaml \
#     --data-path ./data \
#     --pretrained ./output/exp_a_distill/TinyViT-11M-Distill/default/ckpt_epoch_299.pth \
#     --output ./output/eval_cifar100_distill
#
# Expected: Higher accuracy than scratch baseline
# Time: ~1 hour on 1 GPU (50 epochs)

MODEL:
  NAME: TinyViT-11M-CIFAR100-Distill
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.1
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.1

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 8, 14 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 256, 448 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  PIN_MEMORY: True
  MEAN_AND_STD_TYPE: clip  # Match pretraining

TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 5
  BASE_LR: 1e-4
  WARMUP_LR: 1e-7
  MIN_LR: 1e-6
  WEIGHT_DECAY: 0.01
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.75
  AUTO_RESUME: True

DISTILL:
  ENABLED: False

AUG:
  COLOR_JITTER: 0.3
  AUTO_AUGMENT: rand-m5-mstd0.5-inc1
  REPROB: 0.1
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.5
  CUTMIX: 0.5

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
