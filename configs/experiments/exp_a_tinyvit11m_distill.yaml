# =============================================================================
# EXPERIMENT A: TinyViT-11M Distillation Pretraining on ImageNet-1K
# =============================================================================
# Pretrain TinyViT-11M using CLIP-ViT-L/14 soft labels (top-50 logits).
# Following TinyViT paper methodology for knowledge distillation.
#
# Loss: L = (1-alpha)*CrossEntropy + alpha*KL_divergence
#
# After pretraining, finetune on CIFAR-100 for evaluation.
#
# PREREQUISITE: Run step1_clip_save_logits.yaml first!
#
# Usage:
#   torchrun --nproc_per_node=4 --master_port=29500 main.py \
#     --cfg configs/experiments/exp_a_tinyvit11m_distill.yaml \
#     --data-path ./data/ImageNet \
#     --output ./output/exp_a_distill \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/exp_clip_logits/CLIP-ViT-L-SaveLogits/default/
#
# Expected: ~81-82% top-1 on ImageNet-1K
# Time: ~24-48 hours on 4 GPUs (300 epochs)

MODEL:
  NAME: TinyViT-11M-Distill
  TYPE: tiny_vit
  NUM_CLASSES: 1000
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.0

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 8, 14 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 256, 448 ]

DATA:
  DATASET: imagenet
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True
  MEAN_AND_STD_TYPE: clip

TRAIN:
  EPOCHS: 300
  WARMUP_EPOCHS: 20
  BASE_LR: 2e-3
  WARMUP_LR: 2e-6
  MIN_LR: 2e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.9
  AUTO_RESUME: True

DISTILL:
  ENABLED: True
  TEACHER_LOGITS_PATH: ''  # Set via --opts
  LOGITS_TOPK: 50
  TEMPERATURE: 1.0
  ALPHA: 0.5

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 100
SAVE_FREQ: 20
