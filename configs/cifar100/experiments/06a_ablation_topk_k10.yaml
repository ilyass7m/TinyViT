# =============================================================================
# EXPERIMENT 7a: Logit Sparsity Ablation - K=10
# =============================================================================
# Purpose: Test if sparse logits (top-10 only) preserve distillation quality
#
# NOTE: First save logits with K=10:
#   save_logits.py ... --opts DISTILL.LOGITS_TOPK 10 DISTILL.TEACHER_LOGITS_PATH ./output/logits/tinyvit21m_k10/
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp7_ablation_k10.yaml \
#     --data-path ./data \
#     --output ./output/exp7_ablation_k10 \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/tinyvit21m_k10/

MODEL:
  NAME: Exp7-Ablation-K10
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.0

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 5, 10 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 160, 320 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 200
  WARMUP_EPOCHS: 10
  BASE_LR: 2e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.9
  AUTO_RESUME: True

DISTILL:
  ENABLED: True
  TEACHER_LOGITS_PATH: ''
  LOGITS_TOPK: 10  # Only top-10 classes

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 20
