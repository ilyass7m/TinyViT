# ============================================================================
# Part 1: Train ViT-Base Teacher on CIFAR-100
# ============================================================================
# Output: output/P1_teacher_vit_base/
#
# Usage:
#   torchrun --nproc_per_node=1 main.py \
#     --cfg configs/cifar100/experiments/part1_teacher_vit_base.yaml \
#     --data-path ./data \
#     --output output/P1_teacher_vit_base
# ============================================================================

MODEL:
  NAME: ViT-Base-CIFAR100-Teacher
  TYPE: vit_base_patch16_224
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.1
  LABEL_SMOOTHING: 0.1
  PRETRAINED_TIMM: True

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 30
  WARMUP_EPOCHS: 5
  BASE_LR: 2.5e-4
  WARMUP_LR: 1e-7
  MIN_LR: 1e-6
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  AUTO_RESUME: True

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 5
