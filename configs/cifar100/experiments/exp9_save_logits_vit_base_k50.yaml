# =============================================================================
# EXPERIMENT 9c: Save ViT-Base Logits with K=50
# =============================================================================
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 save_logits.py \
#     --cfg configs/cifar100/experiments/exp9_save_logits_vit_base_k50.yaml \
#     --data-path ./data \
#     --output ./output/exp9_save_logits \
#     --resume ./output/exp3_teacher_vit_base/Exp3-ViTBase-Teacher/default/ckpt_best.pth \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/vit_base_k50/

MODEL:
  NAME: Exp9-ViTBase-SaveLogits-K50
  TYPE: vit_base_patch16_224
  NUM_CLASSES: 100
  DROP_RATE: 0.0
  DROP_PATH_RATE: 0.0
  PRETRAINED_TIMM: False

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 10
  START_EPOCH: 0

DISTILL:
  ENABLED: True
  SAVE_TEACHER_LOGITS: True
  TEACHER_LOGITS_PATH: ''
  LOGITS_TOPK: 50

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 100
