# =============================================================================
# EXPERIMENT 3a: Teacher - ResNet-152 (~60M params)
# =============================================================================
# Purpose: Train CNN teacher for comparison with ViT-Base (~86M params)
# Expected accuracy: ~88-91%
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp3_teacher_resnet152.yaml \
#     --data-path ./data \
#     --output ./output/exp3_teacher_resnet152

MODEL:
  NAME: Exp3-ResNet152-Teacher
  TYPE: resnet152
  NUM_CLASSES: 100
  DROP_RATE: 0.0
  PRETRAINED_TIMM: True  # Load ImageNet pretrained weights

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128  # Smaller batch for larger model
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 50  # Shorter finetuning for pretrained teacher
  WARMUP_EPOCHS: 5
  BASE_LR: 1e-4
  WARMUP_LR: 1e-7
  MIN_LR: 1e-6
  WEIGHT_DECAY: 0.01
  CLIP_GRAD: 1.0
  LAYER_LR_DECAY: 1.0
  AUTO_RESUME: True

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  # No Mixup for clean teacher logits
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
