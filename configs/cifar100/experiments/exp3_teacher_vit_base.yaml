# =============================================================================
# EXPERIMENT 3b: Teacher - ViT-Base (~86M params)
# =============================================================================
# Purpose: Train Transformer teacher for comparison
# Expected accuracy: ~89-92%
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp3_teacher_vit_base.yaml \
#     --data-path ./data \
#     --output ./output/exp3_teacher_vit_base

MODEL:
  NAME: Exp3-ViTBase-Teacher
  TYPE: vit_base_patch16_224
  NUM_CLASSES: 100
  DROP_RATE: 0.0
  DROP_PATH_RATE: 0.1
  PRETRAINED_TIMM: True

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 5
  BASE_LR: 5e-4
  WARMUP_LR: 1e-7
  MIN_LR: 1e-6
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 1.0
  LAYER_LR_DECAY: 0.65
  AUTO_RESUME: True

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
