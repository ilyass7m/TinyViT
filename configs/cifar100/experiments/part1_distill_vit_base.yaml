# ============================================================================
# Part 1: Distill TinyViT-5M from ViT-Base on CIFAR-100
# ============================================================================
# Output: output/P1_distill_vit_base/
#
# Usage:
#   torchrun --nproc_per_node=1 main.py \
#     --cfg configs/cifar100/experiments/part1_distill_vit_base.yaml \
#     --data-path ./data \
#     --output output/P1_distill_vit_base \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/vit_base_top50/
#
# TopK Ablation: Use logits saved with different K values
# ============================================================================

MODEL:
  NAME: TinyViT-5M-Distill-ViTBase
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.0
  TINY_VIT:
    DEPTHS: [2, 2, 6, 2]
    NUM_HEADS: [2, 4, 5, 10]
    WINDOW_SIZES: [7, 7, 14, 7]
    EMBED_DIMS: [64, 128, 160, 320]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 100
  WARMUP_EPOCHS: 10
  BASE_LR: 2e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  AUTO_RESUME: True

DISTILL:
  ENABLED: True
  TEACHER_LOGITS_PATH: ''
  LOGITS_TOPK: 50

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 20
