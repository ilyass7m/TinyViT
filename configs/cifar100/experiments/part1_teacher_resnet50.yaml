# ============================================================================
# Part 1: Train ResNet-50 Teacher on CIFAR-100
# ============================================================================
# Output: output/P1_teacher_resnet50/
#
# Usage:
#   torchrun --nproc_per_node=1 main.py \
#     --cfg configs/cifar100/experiments/part1_teacher_resnet50.yaml \
#     --data-path ./data \
#     --output output/P1_teacher_resnet50
# ============================================================================

MODEL:
  NAME: ResNet50-CIFAR100-Teacher
  TYPE: resnet50
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  LABEL_SMOOTHING: 0.1
  PRETRAINED_TIMM: True

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 5
  BASE_LR: 1e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  AUTO_RESUME: True

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
