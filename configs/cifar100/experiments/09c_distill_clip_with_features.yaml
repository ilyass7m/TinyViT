# =============================================================================
# EXPERIMENT 10: Distillation from CLIP with Feature Distillation
# =============================================================================
# Purpose: Extend TinyViT distillation with feature-level knowledge transfer
#
# This experiment uses:
# - Saved logits for logit distillation (offline, efficient)
# - Live teacher model for feature distillation (online)
#
# Loss = (1-α)*CE + α*KL_logits + β*Feature_loss
#
# Expected: Higher accuracy than logit-only distillation
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp10_distill_clip_with_features.yaml \
#     --data-path ./data \
#     --output ./output/exp10_distill_clip_with_features \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/clip_vit_l/ \
#            DISTILL.TEACHER_CHECKPOINT ./output/exp3_teacher_clip_vit_l/Exp3-CLIP-ViT-L-Teacher/ckpt_epoch_29.pth

MODEL:
  NAME: Exp10-TinyViT5M-Distill-CLIP-Features
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.0

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 5, 10 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 160, 320 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128  # Smaller batch due to teacher model in memory
  NUM_WORKERS: 8
  PIN_MEMORY: True
  MEAN_AND_STD_TYPE: clip  # Use CLIP normalization for teacher

TRAIN:
  EPOCHS: 200
  WARMUP_EPOCHS: 10
  BASE_LR: 2e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.9
  AUTO_RESUME: True

DISTILL:
  ENABLED: True
  TEACHER_LOGITS_PATH: ''  # Set via --opts
  LOGITS_TOPK: 100
  # Feature distillation settings
  FEATURE_ENABLED: True
  FEATURE_WEIGHT: 0.5  # β weight for feature loss
  FEATURE_DIM_TEACHER: 768  # CLIP-ViT-L/14
  FEATURE_DIM_STUDENT: 320  # TinyViT-5M
  TEACHER_CHECKPOINT: ''  # Set via --opts

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 20
