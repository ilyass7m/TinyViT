# =============================================================================
# EXPERIMENT 10: Online Feature + Logits Distillation
# Teacher: TinyViT-21M (576-dim features)
# Student: TinyViT-5M (320-dim features)
# =============================================================================
# This experiment uses fully online distillation (no saved logits required).
# The teacher model performs a forward pass each batch.
#
# Loss = KL(student_logits, teacher_logits) + beta * (1 - cosine_sim(proj(s_feat), t_feat))
#
# Prerequisites:
#   - Trained TinyViT-21M checkpoint (from exp3_teacher_tinyvit21m.yaml)
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp10_online_distill_tinyvit21m_to_5m.yaml \
#     --data-path ./data \
#     --output ./output/exp10_online_distill \
#     --opts DISTILL.TEACHER_CHECKPOINT ./output/exp3_teacher_tinyvit21m/.../ckpt_best.pth

MODEL:
  NAME: Exp10-Online-TinyViT21M-to-5M
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.0

  # Student architecture (TinyViT-5M)
  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 5, 10 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 160, 320 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 200
  WARMUP_EPOCHS: 10
  BASE_LR: 2e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.9
  AUTO_RESUME: True

DISTILL:
  # Online distillation (no saved logits needed)
  ONLINE_DISTILL: True
  TEACHER_CHECKPOINT: ''  # Set via --opts

  # Teacher model configuration
  TEACHER_TYPE: tiny_vit
  TEACHER_TINY_VIT:
    EMBED_DIMS: [ 96, 192, 384, 576 ]  # TinyViT-21M
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 3, 6, 12, 18 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    MLP_RATIO: 4.0
    MBCONV_EXPAND_RATIO: 4.0
    LOCAL_CONV_SIZE: 3

  # Logit distillation settings
  TEMPERATURE: 1.0

  # Feature distillation settings
  FEATURE_ENABLED: True
  FEATURE_WEIGHT: 0.5  # beta: weight for feature loss
  FEATURE_DIM_TEACHER: 576  # TinyViT-21M last layer
  FEATURE_DIM_STUDENT: 320  # TinyViT-5M last layer

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  # No mixup/cutmix with distillation
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
