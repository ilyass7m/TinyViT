# =============================================================================
# EXPERIMENT 9: Distillation from CLIP-ViT-L/14 to TinyViT-5M
# =============================================================================
# Purpose: Train TinyViT-5M using CLIP-ViT-L/14 teacher's soft labels
# Expected accuracy: ~85-88% (CLIP is a stronger teacher than ResNet/ViT-Base)
#
# This follows the TinyViT paper methodology using a large CLIP model (304M params)
# to distill knowledge into the tiny TinyViT-5M student (5M params) - 60x compression!
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp9_distill_clip_vit_l.yaml \
#     --data-path ./data \
#     --output ./output/exp9_distill_clip_vit_l \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/clip_vit_l/

MODEL:
  NAME: Exp9-TinyViT5M-Distill-CLIP
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.0  # No smoothing with soft targets

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 5, 10 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 160, 320 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 200
  WARMUP_EPOCHS: 10
  BASE_LR: 2e-3
  WARMUP_LR: 1e-6
  MIN_LR: 1e-5
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.9
  AUTO_RESUME: True

DISTILL:
  ENABLED: True
  TEACHER_LOGITS_PATH: ''  # Set via --opts
  LOGITS_TOPK: 100

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0   # Disabled for distillation
  CUTMIX: 0.0  # Disabled for distillation

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 20
