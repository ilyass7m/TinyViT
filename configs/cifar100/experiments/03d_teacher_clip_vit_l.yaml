# =============================================================================
# EXPERIMENT 3c: Teacher - CLIP-ViT-L/14 (~304M params)
# =============================================================================
# Purpose: Finetune CLIP-ViT-L/14 as large teacher model (as used in TinyViT paper)
# Expected accuracy: ~92-95% (CLIP has strong visual representations)
#
# CLIP-ViT-L/14 was one of the large teacher models used in the original TinyViT
# paper for knowledge distillation on ImageNet-22k. We adapt it here for CIFAR-100.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp3_teacher_clip_vit_l.yaml \
#     --data-path ./data \
#     --output ./output/exp3_teacher_clip_vit_l

MODEL:
  NAME: Exp3-CLIP-ViT-L-Teacher
  TYPE: clip_vit_large_patch14
  NUM_CLASSES: 100
  DROP_RATE: 0.0
  DROP_PATH_RATE: 0.0  # CLIP doesn't use drop path
  PRETRAINED_TIMM: True  # Load OpenAI's CLIP pretrained weights via OpenCLIP

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128  # Small batch due to large model (304M params)
  NUM_WORKERS: 8
  PIN_MEMORY: True
  MEAN_AND_STD_TYPE: clip  # Use CLIP normalization

TRAIN:
  EPOCHS: 30  # Fewer epochs - CLIP is very well pretrained
  WARMUP_EPOCHS: 3
  BASE_LR: 1e-5  # Very low LR - CLIP features are already excellent
  WARMUP_LR: 1e-8
  MIN_LR: 1e-7
  WEIGHT_DECAY: 0.01  # Light weight decay
  CLIP_GRAD: 1.0
  LAYER_LR_DECAY: 1.0  # CLIP doesn't support layer-wise LR decay
  AUTO_RESUME: True

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0  # Disabled for teacher
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
