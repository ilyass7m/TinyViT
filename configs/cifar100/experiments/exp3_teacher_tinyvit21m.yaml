# =============================================================================
# EXPERIMENT 3c: Teacher - TinyViT-21M (~21M params)
# =============================================================================
# Purpose: Train same-family teacher (core TinyViT paper claim)
# Expected accuracy: ~88-91%
#
# Usage:
#   # First download pretrained weights:
#   wget -P pretrained/ https://github.com/wkcn/TinyViT-model-zoo/releases/download/checkpoints/tiny_vit_21m_22k_distill.pth
#
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/experiments/exp3_teacher_tinyvit21m.yaml \
#     --data-path ./data \
#     --output ./output/exp3_teacher_tinyvit21m \
#     --pretrained pretrained/tiny_vit_21m_22k_distill.pth

MODEL:
  NAME: Exp3-TinyViT21M-Teacher
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 3, 6, 12, 24 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 96, 192, 384, 576 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 128
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 50
  WARMUP_EPOCHS: 5
  BASE_LR: 2e-4
  WARMUP_LR: 1e-7
  MIN_LR: 1e-6
  WEIGHT_DECAY: 0.05
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.75
  AUTO_RESUME: True

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
