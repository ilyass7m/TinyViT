# =============================================================================
# EXPERIMENT 4a: Save Teacher Logits - ResNet-152
# =============================================================================
# Purpose: Save ResNet-152 teacher's soft predictions for distillation
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 save_logits.py \
#     --cfg configs/cifar100/experiments/exp4_save_logits_resnet152.yaml \
#     --data-path ./data \
#     --output ./output/exp4_logits \
#     --resume ./output/exp3_teacher_resnet152/Exp3-ResNet152-Teacher/default/ckpt_best.pth \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/resnet152/

MODEL:
  NAME: Exp4-ResNet152-SaveLogits
  TYPE: resnet152
  NUM_CLASSES: 100
  DROP_RATE: 0.0
  PRETRAINED_TIMM: False  # Load from checkpoint

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 10  # Number of augmentation variants to save
  START_EPOCH: 0

DISTILL:
  ENABLED: True
  SAVE_TEACHER_LOGITS: True
  TEACHER_LOGITS_PATH: ''  # Set via --opts
  LOGITS_TOPK: 100  # Full logits for CIFAR-100

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 100
