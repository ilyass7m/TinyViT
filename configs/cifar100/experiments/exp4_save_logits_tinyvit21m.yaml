# =============================================================================
# EXPERIMENT 4c: Save Teacher Logits - TinyViT-21M
# =============================================================================
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 save_logits.py \
#     --cfg configs/cifar100/experiments/exp4_save_logits_tinyvit21m.yaml \
#     --data-path ./data \
#     --output ./output/exp4_logits \
#     --resume ./output/exp3_teacher_tinyvit21m/Exp3-TinyViT21M-Teacher/default/ckpt_best.pth \
#     --opts DISTILL.TEACHER_LOGITS_PATH ./output/logits/tinyvit21m/

MODEL:
  NAME: Exp4-TinyViT21M-SaveLogits
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 3, 6, 12, 24 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 96, 192, 384, 576 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 256
  NUM_WORKERS: 8
  PIN_MEMORY: True

TRAIN:
  EPOCHS: 10
  START_EPOCH: 0

DISTILL:
  ENABLED: True
  SAVE_TEACHER_LOGITS: True
  TEACHER_LOGITS_PATH: ''
  LOGITS_TOPK: 100

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 100
