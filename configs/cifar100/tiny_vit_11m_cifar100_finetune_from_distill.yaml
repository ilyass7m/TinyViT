# =============================================================================
# CIFAR-100 Fine-tuning: TinyViT-11M Pretrained with CLIP Distillation
# =============================================================================
# Purpose: Fine-tune the distillation-pretrained TinyViT-11M on CIFAR-100
#
# This is the final evaluation step for Experiment A (distillation).
# Compare accuracy with the scratch-pretrained baseline.
#
# Expected: Higher accuracy than scratch baseline due to knowledge transfer
# from CLIP teacher during ImageNet-1K pretraining.
#
# Usage:
#   CUDA_VISIBLE_DEVICES=0 torchrun --nproc_per_node=1 --master_port=29500 main.py \
#     --cfg configs/cifar100/tiny_vit_11m_cifar100_finetune_from_distill.yaml \
#     --data-path ./data \
#     --pretrained ./output/tiny_vit_11m_1k_distill_clip/TinyViT-11M-1k-Distill-CLIP/default/ckpt_epoch_299.pth \
#     --output ./output/cifar100_eval/distill

MODEL:
  NAME: TinyViT-11M-CIFAR100-FromDistill
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.1
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.1

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 8, 14 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 256, 448 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  PIN_MEMORY: True
  # Use CLIP normalization (same as pretraining)
  MEAN_AND_STD_TYPE: clip

TRAIN:
  # Fine-tuning schedule (lower LR, fewer epochs)
  EPOCHS: 50
  WARMUP_EPOCHS: 5
  BASE_LR: 1e-4
  WARMUP_LR: 1e-7
  MIN_LR: 1e-6
  WEIGHT_DECAY: 0.01
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.75  # Lower LR for earlier layers
  AUTO_RESUME: True

# No distillation during fine-tuning
DISTILL:
  ENABLED: False

AUG:
  # Moderate augmentation for fine-tuning
  COLOR_JITTER: 0.3
  AUTO_AUGMENT: rand-m5-mstd0.5-inc1
  REPROB: 0.1
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.5
  CUTMIX: 0.5
  MIXUP_PROB: 0.8
  MIXUP_SWITCH_PROB: 0.5
  MIXUP_MODE: batch

TEST:
  CROP: True

SEED: 42
PRINT_FREQ: 50
SAVE_FREQ: 10
