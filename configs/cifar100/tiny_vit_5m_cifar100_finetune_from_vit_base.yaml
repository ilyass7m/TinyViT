# =============================================================================
# CIFAR-100 Fine-tuning: TinyViT-5M from ViT-Base Distillation
# =============================================================================
# Step 2 of Experiment D: Finetune on CIFAR-100
#
# Usage:
#   CUDA_VISIBLE_DEVICES=1 torchrun --nproc_per_node=1 --master_port=29604 main.py \
#     --cfg configs/cifar100/tiny_vit_5m_cifar100_finetune_from_vit_base.yaml \
#     --data-path ./data \
#     --pretrained ./output/tiny_vit_5m_1k_distill_vit_base/TinyViT-5M-1k-Distill-ViTBase/default/ckpt_epoch_299.pth \
#     --output ./output/cifar100_eval/tiny_vit_5m_vit_base

MODEL:
  NAME: TinyViT-5M-CIFAR100-FromViTBase
  TYPE: tiny_vit
  NUM_CLASSES: 100
  DROP_PATH_RATE: 0.0
  DROP_RATE: 0.0
  LABEL_SMOOTHING: 0.1

  TINY_VIT:
    DEPTHS: [ 2, 2, 6, 2 ]
    NUM_HEADS: [ 2, 4, 5, 10 ]
    WINDOW_SIZES: [ 7, 7, 14, 7 ]
    EMBED_DIMS: [ 64, 128, 160, 320 ]

DATA:
  DATASET: cifar100
  IMG_SIZE: 224
  INTERPOLATION: bicubic
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  PIN_MEMORY: True
  MEAN_AND_STD_TYPE: default

TRAIN:
  EPOCHS: 30
  WARMUP_EPOCHS: 5
  BASE_LR: 2.5e-4
  WARMUP_LR: 2.5e-7
  MIN_LR: 1e-5
  WEIGHT_DECAY: 1e-8
  CLIP_GRAD: 5.0
  LAYER_LR_DECAY: 0.8
  AUTO_RESUME: True
  EVAL_BN_WHEN_TRAINING: True

DISTILL:
  ENABLED: False

AUG:
  COLOR_JITTER: 0.4
  AUTO_AUGMENT: rand-m9-mstd0.5-inc1
  REPROB: 0.25
  REMODE: pixel
  RECOUNT: 1
  MIXUP: 0.0
  CUTMIX: 0.0

TEST:
  CROP: True

SEED: 0
PRINT_FREQ: 50
SAVE_FREQ: 10
